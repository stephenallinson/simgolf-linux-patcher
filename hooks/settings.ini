; Settings for SimGolf on Linux, read by sghooks.dll when the game starts.
; The environment variables SIMGOLF_RES and SIMGOLF_ART override [Display].

[Display]
; Screen size, at least 800x600. The art is drawn at its original pixel size,
; so a bigger screen shows more of the course; menus stay 800x600, centred.
; run.sh scales the game up to fill your monitor (gamescope), so pick a size
; your monitor is a whole multiple of: 1280x720 for 2560x1440 (2x),
; 1920x1080 or 1280x720 for 3840x2160, 1024x768 or 800x600 for 4:3 screens.
Resolution=800x600
; native: the original 800x600 art, 1:1 (sharpest).
; large: the game's enlarged 1024x768 / 1280x1024 art, chosen by screen height.
Art=native
; 1: keep the mouse inside the game window, so edge panning can't slide
; onto another monitor (gamescope only). 0: off.
LockMouse=0

[Sound]
; Volumes in percent, 0 to 100.
Master=100
Music=100
Voices=100
Effects=100
Ambience=100
Interface=100
